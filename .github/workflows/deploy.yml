name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the deploy job to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue rather than cancel, so an in-flight
# deploy finishes and the site is never left half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --run

      - name: Verify all Firebase secrets are set
        # Checked before the build so a missing or misspelled secret fails
        # loudly here rather than producing a green deploy with a dead
        # sign-in button. Only presence is reported, never the values.
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: |
          missing=0
          for name in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN \
                      VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_STORAGE_BUCKET \
                      VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            else
              echo "ok: $name is set"
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "::error::Add the missing secrets under Settings > Secrets and variables > Actions (Repository secrets)."
            exit 1
          fi

      - name: Build
        # Firebase web config is compiled into the client bundle at build time,
        # so these must be present here rather than at runtime. They are not
        # true secrets — they ship publicly in the JS — but Actions secrets are
        # the clean way to inject build-time values. Firestore rules are what
        # actually protect user data.
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Confirm Firebase config reached the bundle
        # Belt and braces: the secrets exist, but confirm Vite actually inlined
        # them, so a build-config regression cannot ship a dead sign-in button.
        env:
          PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$PROJECT_ID" ]; then
            echo "::error::PROJECT_ID empty; cannot verify bundle."
            exit 1
          fi
          if ! grep -rqF "$PROJECT_ID" dist/assets/*.js; then
            echo "::error::Firebase config did not reach the build output."
            exit 1
          fi
          echo "Firebase config present in bundle."

      - name: Confirm asset paths are relative
        # Vite must emit ./assets/... — absolute /assets/... 404s on Pages,
        # which serves this repo from /medi-mindful-moment/, not the root.
        run: |
          if grep -qE '(src|href)="/assets/' dist/index.html; then
            echo "::error::Absolute asset paths detected. vite.config.js must set base: './'."
            exit 1
          fi
          echo "Asset paths are relative."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
