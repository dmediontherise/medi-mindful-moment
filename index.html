<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medi Mindful Moment - Daily Affirmation Generator</title>
    <!-- Prevent flash of wrong theme before first paint -->
    <script>
        (function() {
            try {
                var stored = localStorage.getItem('medi_mindful_theme');
                var isDark = stored === 'dark' || (!stored && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            } catch (e) {}
        })();
    </script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen flex items-center justify-center p-3 sm:p-4 bg-app-theme text-main-theme">

    <!-- Main Application Container -->
    <div id="app" tabindex="-1" class="w-full max-w-lg bg-card-theme border border-subtle-theme shadow-2xl rounded-3xl p-4 sm:p-8 transition-all duration-300">
        
        <header class="mb-6">
            <div class="flex items-center justify-between gap-2 mb-3">
                <p id="current-date" class="text-xs sm:text-sm font-semibold text-blue-600 dark:text-blue-400 truncate min-w-0"></p>
                <div class="flex items-center space-x-2 flex-shrink-0">
                    <!-- Theme Toggle Button -->
                    <button id="theme-toggle-btn" aria-label="Toggle theme" class="p-2 rounded-xl border border-subtle-theme text-muted-theme hover:text-main-theme transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
                        </svg>
                    </button>
                    <!-- Ambient Fullscreen View Button -->
                    <button id="ambient-btn" aria-label="Enter ambient fullscreen view" title="Enter ambient fullscreen view" class="p-2 rounded-xl border border-subtle-theme text-muted-theme hover:text-main-theme transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M3.75 20.25v-4.5m0 4.5h4.5m-4.5 0L9 15M20.25 3.75h-4.5m4.5 0v4.5m0-4.5L15 9m5.25 11.25h-4.5m4.5 0v-4.5m0 4.5L15 15" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="text-center">
                <h1 class="text-2xl sm:text-3xl font-extrabold text-[#104E9E] dark:text-blue-400">Medi Mindful Moment</h1>
                <p id="auth-status" class="text-xs text-muted-theme mt-0.5">Connecting...</p> 
            </div>
        </header>

        <!-- Dynamic Content Area -->
        <div id="content-area" class="min-h-[380px] flex flex-col justify-center">
            <!-- Content will be rendered here (Mood Selector, Card, History) -->
            <div class="flex justify-center items-center h-full">
                <div class="text-center text-muted-theme">Initializing app...</div>
            </div>
        </div>

        <!-- Floating Bottom Navigation -->
        <nav id="nav-bar" aria-label="Main Navigation" class="flex justify-around mt-6 border-t border-subtle-theme pt-4 sticky bottom-0 bg-card-theme shadow-t-lg" style="display: none;">
            <button id="nav-new-affirmation" aria-label="New Affirmation" class="p-3 rounded-xl hover:bg-gray-100 dark:hover:bg-slate-800 transition-colors text-muted-theme hover:text-main-theme">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-7 h-7">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v18m9-9H3" />
                </svg>
                <span class="sr-only">New Affirmation</span>
            </button>
            <button id="nav-history" aria-label="History" class="p-3 rounded-xl hover:bg-gray-100 dark:hover:bg-slate-800 transition-colors text-muted-theme hover:text-main-theme">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-7 h-7">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.75h-7.5v2.75M19.5 7.5v-2.75h-7.5v2.75m7.5 10.5v-2.75h-7.5v2.75M4.5 7.5v-2.75h-2.25v2.75M4.5 14.25v-2.75h-2.25v2.75M4.5 21v-2.75h-2.25v2.75" />
                </svg>
                <span class="sr-only">History</span>
            </button>
            <button id="nav-favorites" aria-label="Favorites" class="p-3 rounded-xl hover:bg-gray-100 dark:hover:bg-slate-800 transition-colors text-muted-theme hover:text-main-theme">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-7 h-7">
                    <path fill-rule="evenodd" d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.006 5.404.434c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.434 2.082-5.005Z" clip-rule="evenodd" />
                </svg>
                <span class="sr-only">Favorites</span>
            </button>
        </nav>
    </div>
    
    <!-- Share Options Modal -->
    <div id="share-modal" role="dialog" aria-modal="true" aria-labelledby="share-modal-title" aria-hidden="true" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 z-50 transition-opacity duration-300" style="display: none;">
        <div id="modal-content" class="bg-card-theme border border-subtle-theme p-6 rounded-2xl shadow-2xl w-full max-w-xs transform transition-all duration-300 scale-90">
            <h3 id="share-modal-title" class="text-xl font-bold text-main-theme mb-4 text-center">Share This Moment</h3>
            <div id="share-content-text" class="text-center text-sm font-light text-muted-theme mb-4 italic p-2 border-b border-subtle-theme"></div>
            
            <!-- Fallback Guidance -->
            <p class="text-xs text-red-500 dark:text-red-400 text-center mb-4 p-2 bg-red-50 dark:bg-red-950/40 rounded-lg">
                <span class="font-bold">Important:</span> If Text/Email buttons do not open an app, please use "Copy to Clipboard" and paste manually.
            </p>

            <div class="space-y-3" id="share-buttons-container">
                <!-- Share buttons will be injected here -->
            </div>
            <button id="close-modal-btn" class="w-full mt-6 py-3 rounded-xl bg-gray-200 dark:bg-slate-700 text-main-theme font-semibold hover:bg-gray-300 dark:hover:bg-slate-600 transition-colors">Close</button>
        </div>
    </div>

    <!-- Floating Toast Notification -->
    <div id="toast-notification" class="fixed bottom-4 left-1/2 -translate-x-1/2 p-3 bg-green-700 text-white rounded-xl shadow-xl z-50 text-sm font-medium transition-all" style="display: none; opacity: 0;">
        <!-- Message will be inserted here -->
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
